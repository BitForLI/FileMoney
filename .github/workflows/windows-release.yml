name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        shell: pwsh
        run: |
          $succeeded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Build attempt $attempt of 3"
            npm run dist:win
            if ($LASTEXITCODE -eq 0) {
              $succeeded = $true
              break
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds 15
            }
          }
          if (-not $succeeded) {
            exit 1
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "release/Pagefold-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not created"
          }
          gh release create "${{ github.ref_name }}" $installer.FullName --title "Pagefold ${{ github.ref_name }}" --generate-notes
